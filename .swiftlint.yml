included:
  - MarketWatch
  - MarketWatchTests

excluded:
  - Pods

# Formatting rules owned by SwiftFormat.
disabled_rules:
  - trailing_comma

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - first_where
  - private_outlet

empty_count:
  severity: warning

# SwiftFormat wraps the brace of multiline signatures onto its own line.
opening_brace:
  ignore_multiline_function_signatures: true

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

identifier_name:
  excluded:
    - id
    - x
    - y
